global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: prometheus

  - job_name: pi-daemon
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8766"]
        labels:
          service: pi-daemon

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: alloy

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo

  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]
        labels:
          service: pyroscope

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio
