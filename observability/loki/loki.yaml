auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h
  aws:
    endpoint: minio:9000
    region: us-east-1
    bucketnames: local-agent-loki
    access_key_id: localagent
    secret_access_key: localagent-secret
    s3forcepathstyle: true
    insecure: true

# The single-machine dashboard can query several days of chunks at startup.
# Keep that useful behavior without allowing the embedded chunk cache to grow
# into a multi-gigabyte Go heap.
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 64
      ttl: 15m
  skip_query_writeback_cache_older_than: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  max_query_lookback: 168h

analytics:
  reporting_enabled: false
