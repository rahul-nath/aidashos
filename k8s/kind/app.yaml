apiVersion: v1
kind: ConfigMap
metadata:
  name: local-agent-config
data:
  DBOS_APPLICATION_NAME: local-first-agent-os
  LOCAL_AGENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/local_agent
  LOCAL_AGENT_DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/local_agent_dbos
  DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/local_agent_dbos
  LOCAL_AGENT_USE_DBOS: "true"
  LOCAL_AGENT_ENV: kind
  LOCAL_AGENT_SERVICE_NAME: local-agent
  LOCAL_AGENT_STRUCTURED_LOGS: "true"
  LOCAL_AGENT_OTEL_TRACES_ENABLED: "false"
  LOCAL_AGENT_PYROSCOPE_ENABLED: "false"
  LOCAL_AGENT_MEMORY_PROFILING_ENABLED: "false"
  LOCAL_AGENT_MOCK_MODELS: "true"
  LOCAL_AGENT_ARTIFACT_ROOT: /data/artifacts
  LOCAL_AGENT_ARTIFACT_BACKEND: filesystem
  LOCAL_AGENT_SPOOL_DIR: /data/spool
  LOCAL_AGENT_CONFIG_DIR: /app/configs
  LOCAL_AGENT_WEB_DIST: /app/web/dist
  LOCAL_AGENT_LLAMA_BASE_URL: http://host.docker.internal:8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-agent-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-agent-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: local-agent-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-agent-app
    spec:
      containers:
        - name: app
          image: local-first-agent-os:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: local-agent-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOCAL_AGENT_DBOS_EXECUTOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOCAL_AGENT_DBOS_CONDUCTOR_EXECUTOR_METADATA
              value: '{"runtime":"kubernetes","namespace":"$(POD_NAMESPACE)","pod":"$(POD_NAME)","deployment":"local-agent-app"}'
            - name: DBOS_CONDUCTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: dbos-conductor
                  key: DBOS_CONDUCTOR_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8000
            - name: dbos-admin
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: local-agent-data
              mountPath: /data
      volumes:
        - name: local-agent-data
          persistentVolumeClaim:
            claimName: local-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: local-agent-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: local-agent-app
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: dbos-admin
      port: 3001
      targetPort: dbos-admin
