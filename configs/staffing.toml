# Staffing plan: which model plays which tier, and how many can run at once.
# This is the ONE place that maps tier -> concrete omni harness. Swapping which
# model plays "staff" is a one-line edit here; no code changes.
#
# Locked mapping: codex = senior, claude = staff, gemma (via pi) = junior.
# Swapped 2026-08-11, from codex-implements: the codex CLI reports its weekly
# quota exhausted until 2026-08-17 7:58 PM, six days out, so both frontier
# seats run on claude with two different models for the outage. That is the
# sanctioned fallback `load_bench` already documents - review keeps a fresh
# pass and a different model, and loses provider diversity - not a shared seat,
# which `test_the_repo_bench_never_lets_the_reviewer_be_the_author` still
# refuses. The 2026-08-09 assessment (codex the better coder, claude the better
# critic) still stands; restoring codex to a seat when its quota returns is an
# operator decision, not an automatic one.
#
# POLICIES.md is keyed on the seat, not the vendor, so swapping a harness here
# needs no edit there and no hash re-pin. That coupling is what broke this file
# twice: a swap left the implementer denied the write its own plan had granted.
#
# Model ids below are passed to their CLI verbatim; nothing validates them at
# load, so a typo surfaces as a dispatch failure at spawn time. Before writing
# a new id here (say, restaffing during a subscription outage), prove it with a
# one-line nonce against the CLI that will run it:
#   claude --model <id> --print "Reply with exactly: ok"
#   codex exec --skip-git-repo-check --model <id> "Reply with exactly: ok"
# ./scripts/first-run-check.sh --probe-frontier-models runs that probe against
# every id staffed below.

# Restaffed 2026-08-13, operator's call. The two-vendor cross-check is BACK:
# senior is codex, staff is claude, so the reviewer is no longer the same
# provider as the author. That property was collapsed on 2026-08-11 only because
# codex reported its weekly quota exhausted; `codex exec --model gpt-5.6-sol`
# was probed live on 2026-08-13 and answered, so the outage that forced the
# both-claude seating is over ahead of the 2026-08-17 date the handoff recorded.

[bench.staff]
harness = "claude"
# Opus on the dedicated review seat. Different vendor from senior now, which is
# what makes this review rather than the author re-reading itself;
# `_warn_when_review_is_self_review` compares `(harness, model)`, and these two
# no longer share either.
model = "claude-opus-5"
# "xhigh". Review runs at capacity 1 on short turns, so this is the cheap dial:
# the seat spends far less window than the implementer does, and catching a bad
# change is worth more per token here than anywhere else on the bench.
reasoning_effort = "xhigh"
capacity = 1

[bench.senior]
harness = "codex"
# Pinned rather than left to the CLI default, so which model ran a milestone is a
# fact in the compiled record instead of whatever the harness happened to pick
# that week. Becomes `codex exec --model gpt-5.6-sol -c model_reasoning_effort=high`.
#
# The 2026-08-09 assessment that codex is the better coder and claude the better
# critic is what this seating restores, now that codex answers again.
model = "gpt-5.6-sol"
# "high" rather than the top of the range: effort is paid on every concurrent
# senior turn at once, and this is the seat that runs at capacity 2 on long
# implementation turns.
reasoning_effort = "high"
# 2 rather than the 3 codex ran at previously. The seats no longer share one
# subscription, so this could go back up; it stays at 2 until a run shows the
# window can take it.
capacity = 2
# The fallback model if codex is spent again, and it is read now.
#
# It was inert until `_replacement_for` in `harness_availability.py` started
# consulting it. That function answers two questions where it used to answer
# one: `_unspent_frontier_peer` still decides which *harness* a spent tier moves
# to, and the model comes from this list rather than from whatever the peer slot
# happened to hold. Handing back the peer's whole slot is what used to put one
# model on both seats and collapse the cross-check.
#
# A backup is taken only when it differs from every model another frontier tier
# holds. Naming the peer's own model here buys nothing, since the entire point
# is to restore variance between implementer and reviewer, so such an entry is
# skipped rather than applied and the tier lands on the peer's slot unchanged.
backup_models = ["claude-sonnet-5"]

[bench.junior]
harness = "pi"
model = "gemma4"
capacity = 4
# Backup junior model(s) — kept for a local comparison eval (gemma4 vs qwen3.8).
# The Pi harness routes through the local pi-daemon -> llama-server, so these
# are plain llama-server model ids (no omni gateway prefix).
backup_models = ["qwen3.8-27b-mtp"]
