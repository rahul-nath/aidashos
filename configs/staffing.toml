# Named pairs own model, effort, and per-tier capacity together.
# Same-model review is allowed in a separate session with isolated planning
# context and read-only final review; provider diversity is an optional preference.
# POLICIES.md grants authority by seat, never by model or vendor.
# Locked mapping: codex = senior, codex = staff; junior follows active-general.

# Used by unassigned dispatches, direct queries, and readiness checks.
seated_pairing = "codex-only"
# Direct /codex questions have no staff/senior role; retain their explicit Sol model.
direct_query_models = { codex = "gpt-5.6-sol" }

# WorkUnit attempts choose through this policy, not seated_pairing alone.
# "auto" ranks model_quality.toml; "fixed" admits exactly the named pair.
# "preferred" tries the named pair first, then only its explicit fallback policy.
# Every mode retains availability checks and records resolution before dispatch.
# An already-recorded attempt keeps its immutable assignment on replay.
[work_unit_pairing]
mode = "preferred"
pairing = "codex-only"
fallback = { mode = "explicit", pairings = ["claude-only"] }

# Optional per-WorkUnit override, applied only to that WorkUnit's new attempts:
# [work_unit_pairing_overrides."<work-unit-id>"]
# mode = "auto"
# Or use mode = "fixed" with pairing = "<declared-pair>".

[pairings.codex-sol-recovery]
fallback = []

[pairings.codex-sol-recovery.senior]
harness = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
capacity = 1

[pairings.codex-sol-recovery.staff]
harness = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
capacity = 1

# ------------------------------------------------------------------ pairings

# The normal seating once codex returns: codex implements, claude reviews, and
# the strongest claude model sits in the critic seat at xhigh - review is the
# safety net and stays expensive on purpose. Escapes: codex dies -> claude-only;
# claude dies -> codex-only. The chain is walked in order and the first pairing
# avoiding every spent vendor takes both seats, so the order only matters when
# a pairing avoids nothing it needs to.
[pairings.cross-vendor]
fallback = ["claude-only", "codex-only"]

[pairings.cross-vendor.senior]
harness = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
# One per tier; see the claude-only senior seat for the ruling.
capacity = 1

# The senior reading workload keeps a cheaper codex id, restoring the
# 2026-08-16 declaration this seat held before the outage moved everything to
# claude. Reading the repository does not need the implementation seat's
# profile.
[pairings.cross-vendor.senior.workloads.independent_reading]
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[pairings.cross-vendor.staff]
harness = "claude"
model = "claude-opus-5"
# xhigh: the critic seat runs at capacity 1, so the top of the effort range is
# paid once per review, and this pairing is only seated when claude's window is
# not shared with the implementer.
reasoning_effort = "xhigh"
capacity = 1

[pairings.cross-vendor.staff.workloads.independent_reading]
model = "claude-sonnet-5"
reasoning_effort = "medium"

# The codex-outage seating. Restaffed 2026-08-30 by the operator's call:
# senior is claude-sonnet-5 at xhigh (implementer), staff is claude-opus-5
# (reviewer). Opus is the stronger model of the pair, so the critic seat still
# holds it, which is the shape the 2026-08-09 assessment (the better critic
# reviews) asks for within one vendor.
#
# This replaces the 2026-08-18 seating of opus implementing and fable
# reviewing. Both frontier seats spend one claude subscription window here, and
# on 2026-08-30 that window refused a concurrent turn: two claude calls started
# in the same second on work unit c88ff4167c66, one completed and the other
# came back `USAGE_LIMIT`. Moving the implementer down to Sonnet buys the depth
# back through effort rather than through the model, and leaves the expensive
# model on the one seat that runs at capacity 1.
#
# `claude-sonnet-5`, `claude-opus-5`, and `--effort xhigh` were each probed
# live on 2026-08-30 with the one-line nonce and answered.
[pairings.claude-only]
fallback = ["codex-only"]

[pairings.claude-only.senior]
harness = "claude"
# Pinned rather than left to the CLI default, so which model ran a milestone is
# a fact in the compiled record instead of whatever the harness happened to
# pick that week. Becomes `claude --model claude-sonnet-5 --effort xhigh`.
model = "claude-sonnet-5"
# xhigh, which is the top of the range and the opposite dial from the model.
# Sonnet is the cheaper of the two seats' models, so depth on implementation
# turns is bought with effort instead; that trade is what frees the claude
# window this pairing shares between both frontier seats.
reasoning_effort = "xhigh"
# One. A tier is a statement about quality, not about how many processes
# carry it: two senior agents are not one staff agent, and running two of
# them only spent the window faster. Where a task really does divide - a
# parallel implementation over disjoint files - the seated agent is told to
# spawn its own subagents and make that call itself, because it can see the
# file set and this file cannot.
capacity = 1

# Independent reading is still senior-owned work, but it does not need the
# implementation seat's effort profile. Since 2026-08-30 the seat itself is
# Sonnet, so this override is purely an effort demotion from xhigh to medium
# rather than a change of model. The executor selects it only for the typed
# independent-reading planning phase.
[pairings.claude-only.senior.workloads.independent_reading]
model = "claude-sonnet-5"
reasoning_effort = "medium"

[pairings.claude-only.staff]
harness = "claude"
# Opus on the dedicated review seat, sharing the implementer's provider quota.
model = "claude-opus-5"
# "high", down from the xhigh this seat runs in cross-vendor: both frontier
# seats spend one claude subscription window here, so the top of the effort
# range is no longer a free dial; operator's call 2026-08-30.
reasoning_effort = "high"
capacity = 1

# The staff reading phase routes through the same workload
# (`_judgment_workload` sends both reading phases to INDEPENDENT_READING), so
# it gets the same demotion: reading the repository does not need the review
# seat's model. The staff FINAL review keeps the full Opus slot - that pass
# is the safety net and stays expensive on purpose.
[pairings.claude-only.staff.workloads.independent_reading]
model = "claude-sonnet-5"
reasoning_effort = "medium"

# Same-provider, separate-session pairing. WorkUnit fallback is declared above.
# Sol implements at xhigh; Astra reviews at high. Both profiles are explicit
# operator pins, independent of the optional automatic quality ranking.
[pairings.codex-only]
fallback = []

[pairings.codex-only.senior]
harness = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
# One per tier; see the claude-only senior seat for the ruling.
capacity = 1

[pairings.codex-only.staff]
harness = "codex"
model = "gpt-6-astra"
reasoning_effort = "high"
capacity = 1

# ------------------------------------------------------------------ solo tiers

# Junior is seated alone, so it stays in [bench]: it has no pair, because there
# is no second local model checking the first one's work at this tier.
[bench.junior]
harness = "pi"
capacity = 4
# A local seat with no model pin follows the durable active-general selection.
# `pi /start /general` and `pi /start /qwen3.8` therefore select the model for
# every junior workload without editing staffing policy or restarting dispatch.
