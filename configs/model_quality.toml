# Model quality scores, and the one knob that trades quality against provider
# diversity. This file is the input to the pairing lattice: every legal
# (senior, staff) pair is scored from these rows, ordered, and walked until one
# answers.
#
# ------------------------------------------------- what a row actually is
#
# A row is a model AT AN EFFORT LEVEL, not a model. Effort moves quality as much
# as the model choice does, and it moves cost with it, so a chart keyed on the
# model alone cannot express the thing this system has to decide. The operator's
# 2026-08-30 reading of the Artificial Analysis leaderboard makes the point
# sharply: `claude-opus-5` at low effort and `qwen3.8-27b-mtp` at xhigh both
# score 52, and `gpt-5.6-sol` at low scores 51 - so a local 27B running hard
# outranks two frontier models running lazily. "Opus" is not a quality level;
# "Opus at xhigh" is.
#
# `vendor` rather than `harness` carries the diversity term. The harness is how
# a model is spawned; the vendor is whose training run it came from, which is
# what makes error modes independent. Gemma and Qwen are both `pi` locally and
# are Google and Alibaba models, so an all-local pairing of the two is genuinely
# cross-vendor and is scored as such.
#
# ---------------------------------------------------------------- provenance
#
# Re-derivation is MANUAL and deliberate. Nothing in the runtime fetches these:
# a staffing decision that changed because a third party re-ranked a model
# overnight would be an unreviewed change to which model writes this operator's
# code. Update by hand from https://artificialanalysis.ai/leaderboards/models
# and commit it like any other ruling.
#
# TWENTY of the twenty-three rows below are measured, read off the
# leaderboard on 2026-08-30 and marked `anchor = true`.
#
# Exactly THREE are operator estimates: `claude-sonnet-5` at xhigh and at
# medium, and `gemma4`, which is not on the leaderboard at all. None of the
# three can decide the top of the lattice - the highest of them is 54, below
# nine measured rows - so an estimate cannot choose which pairing runs. That
# was not true earlier in the day, when the whole top band was guessed.
#
# `tests/test_pairing_lattice.py` asserts that every seating this operator has
# ever declared stays legal under whatever numbers are here, so a re-derivation
# that contradicts the history fails by name rather than landing quietly.
#
# The scale is the leaderboard's intelligence index. Only the order and the gaps
# are used.

[source]
name = "Artificial Analysis intelligence index (20 of 23 rows measured); the 3 estimates all score below the decisive band"
derived_at = "2026-08-30"
rederive_from = "https://artificialanalysis.ai/leaderboards/models"

[scoring]
# Added when a pairing's two seats come from different vendors.
#
# Eight, and it does real work rather than decorate. Without it the lattice
# ranks the best same-vendor Anthropic pair above the cross-vendor one and the
# provider diversity this operator values is lost silently to arithmetic. At 8
# the trade is visible: diversity wins when the quality gap it costs is small
# and loses when the gap is large. Set it to 0 to rank on raw quality alone.
diversity_bonus = 8

# --------------------------------------------------------------------- models
#
# `effort` is the word this model's own harness accepts, passed through
# verbatim: claude takes `--effort <x>`, codex takes
# `-c model_reasoning_effort=<x>`. A local model takes none, and by the
# operator's ruling always runs at its top setting - there is no per-token bill
# to economise against, so anything less is quality left on the table.
#
# `anchor = true` means the number was read off the leaderboard. Everything else
# is an operator estimate, and the estimates are now only for rows the operator
# could not see: the leaderboard slice captured on 2026-08-30 was sorted
# descending and topped out at 57, so anything scoring above that - Fable at
# any effort, Opus above low, Sol above medium - is still a guess anchored to
# the seating history rather than a measurement.

# ---- Anthropic, via the claude harness
#
# Note what the top of this band says, because the staffing file used to assume
# the opposite: Opus 5 at xhigh and at max both score 63, and Fable 5 scores 62.
# Opus running hard is the better critic, not Fable. The 2026-08-18 seating that
# put Fable in the critic seat over Opus at high (61) was right by one point and
# for the wrong reason.
[[models]]
harness = "claude"
vendor = "anthropic"
model = "claude-opus-5"
effort = "max"
quality = 63
anchor = true

[[models]]
harness = "claude"
vendor = "anthropic"
model = "claude-opus-5"
effort = "xhigh"
quality = 63
anchor = true

