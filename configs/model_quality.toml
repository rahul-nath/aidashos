# ---- Local, via the pi harness and the llama server.
#
# These rows make an all-local pairing representable, which
# docs/local_fallback_seating_gawd.md asks for and
# tests/test_work_unit_golden_path.py already proves runs end to end with
# `harness = "pi"` in every seat.
#
# The measured numbers reversed that document's proposed seating. It had gemma4
# implementing and glimmer reviewing, because the registry calls glimmer the
# "deliberator". Muse Glimmer at high scores 35 and Qwen3.8 27B at xhigh scores
# 52, so glimmer is the weaker model and the seats are now the other way round.
# The document records this as decision D6.
[[models]]
harness = "pi"
vendor = "alibaba"
model = "qwen3.8-27b-mtp"
effort = "xhigh"
quality = 52
anchor = true

[[models]]
harness = "pi"
vendor = "alibaba"
model = "qwen3.8-27b-mtp"
effort = "medium"
quality = 44
anchor = true

# Meta's model, not a house one - the vendor matters because it is what makes an
# all-local glimmer/qwen pairing count as cross-vendor.
[[models]]
harness = "pi"
vendor = "meta"
model = "glimmer"
effort = "high"
quality = 35
anchor = true

# The fast local path, and the weakest thing on this bench. Not on the
# leaderboard at all, so this is a floor rather than a measurement.
