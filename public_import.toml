# aidashos.com. `web/` above is the operator's cockpit, served from the running
# system; this is the public landing page, a separate static site. It travels
# because it is the top of this repository's own funnel and because it imports
# docs/onboarding/prompts.json at build time, so the two cannot drift. Its
# node_modules/ and dist/ are gitignored, and the importer skips whatever
# git ignores.
#
# Named `landing_page_website/` rather than `website/` since 2026-08-23, so the
# directory Netlify builds from is unmistakable next to `web/`. Its netlify.toml
