# LICENSE is not here, and its absence is load-bearing rather than an
# oversight. The private tree deleted its copy on 2026-08-15 so the two trees
# can be told apart at a glance, which makes this repository the only place the
# AGPL text lives. The importer never deletes, so the file already here
# survives every sync; if it is ever lost, restore it from
# https://www.gnu.org/licenses/agpl-3.0.txt rather than from the source tree.
# `pyproject.toml` still declares `license = "AGPL-3.0-or-later"` and every
# source file still carries its SPDX header, so nothing about the license
# changed except which tree keeps the text.

[[allow]]
path = "Makefile"
kind = "file"
overwrite = true

# The MCP client config a fresh clone needs. Claude Code reads it from the repo
# root, which is what makes "attach your own AI tool" a zero-step claim.
[[allow]]
path = ".mcp.json"
kind = "file"
overwrite = true

# Required at runtime, not documentation. `policy_document.py` reads it from the
# repository root and `POLICY_CONTENT_HASH` is pinned against its bytes. Absent,
# `load_policy_document` compiles to an empty policy that permits everything -
# deliberate, so a machine predating the file behaves as it did before, but it
# means a public snapshot missing this file ships with no written policy at all
# and no sign that it is missing one.
[[allow]]
path = "POLICIES.md"
