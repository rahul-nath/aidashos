# README.md, CLAUDE.md, AGENTS.md, and LICENSE are deliberately absent from this
# list. The private copies of the first three are written for an operator who
# has the handoff log, the design docs, and the private target-project registry
# in front of them, and they link to all three; LICENSE has no private copy at
# all any more. This repository owns all four, and the importer never touches a
# destination file it was not asked to write, so each survives every import.

# The documentation tree does not travel. The private repository's docs/ is a
# working engineering log - dated handoffs, session postmortems, design
# arguments, client-project milestones - and publishing it publishes a
# narrative, not a system. Exactly two paths under docs/ are here, and both are
# here because code fails without them rather than because a reader wants them:
#
# docs/configuration.md is generated from the Settings model, not written.
# `scripts/dump_config_reference.py --check` reads a missing file as an empty
# one, so its absence is a mismatch, and `make config-docs-check` and
# `tests/test_openapi_contract.py` both fail on it.
#
# docs/examples/ holds the two design documents the test suite compiles. Both
# are loaded by path: `tests/work_unit_support.py` reads the acceptance doc and
# `tests/test_work_unit_golden_path.py` reads the golden-path doc.
[[allow]]
path = "docs/configuration.md"
kind = "file"
overwrite = true

[[allow]]
path = "docs/examples"
kind = "directory"
overwrite = true

# The onboarding lane, which is the exception the paragraph above anticipates:
# these are not a narrative about how the system was built, they are the
# instructions for standing it up. docs/onboarding/prompts.json is the single
# source for the prompt sequence - the landing page imports it at build time and
# tests/test_onboarding_prompts.py pins it to the scripts it names - so a public
# clone missing it would ship a walkthrough and a website that disagree.
[[allow]]
path = "docs/onboarding"
kind = "directory"
overwrite = true

# The two operator runbooks the travelling test suite reads.
#
# tests/ travels whole and docs/ does not, and that asymmetry shipped a suite
# which had never passed in the snapshot. The fix is not to ship whatever a test
# names: a document travels only when a public clone has its own reason to want
# it, and tests whose subject is private-repo-owned skip instead.
#
# These two earn it on their own. They are the instructions for driving a system
# this repository ships, so a public clone that can run the software and cannot
# read how to operate it is missing the half that matters.
# tests/test_operator_command_surface.py scans their fenced bash and asserts
# every command resolves, which is what keeps them true.
#
# Deliberately NOT here: docs/demo_shooting_script.md, a recording plan that
# names what not to show on camera and which shots are pre-recorded, and
# docs/deep_think_buys_a_second_pass_gawd.md, an unrun plan of this repository's
# whose test is a pre-flight check with no public meaning. Both scanned clean
# against the release denylist; neither has a reason to be read by a stranger.
#
# Both were scanned against docs/public_release_checklist.md's denylist on
# 2026-08-15 with zero hits.
[[allow]]
path = "docs/cockpit_e2e_runbook.md"
kind = "file"
overwrite = true

[[allow]]
path = "docs/work_unit_operator_walkthrough.md"
kind = "file"
overwrite = true

# The load-bearing decisions, each with what it buys and what it costs, including
# the debt taken on deliberately. It travels because it is the document a reader
# evaluating the project wants when reading 30k lines of source is not the right
# use of their time, which is the criterion this manifest uses everywhere else:
# a document travels because a public reader wants it, never because a test
# named it. Scanned against docs/public_release_checklist.md's denylist on
# 2026-08-17, clean.
[[allow]]
path = "docs/design_tradeoffs.md"
kind = "file"
overwrite = true

# The package-level map design_tradeoffs.md sends its reader to on line 5. It
# travels because that link would otherwise be broken on the first screen of the
# document an evaluating reader is most likely to open, which is the docs/ travel
# asymmetry that docs/public_release_checklist.md exists to warn about. Clean
# against the denylist on 2026-08-17, and it has no relative links of its own, so
# publishing it drags nothing further behind it.
[[allow]]
path = "docs/code_structure.md"
kind = "file"
overwrite = true

# The agent-facing manual. It travels for the same reason the onboarding lane
# does: this system has a hard requirement that an AI agent with local disk
# access is the primary way a person uses it, and a public clone whose agent has
# no document explaining what the system is for ships the requirement without
# the means to meet it. `skills/operate-agent-os/SKILL.md` points at it by path.
[[allow]]
path = "docs/AGENT_MANUAL.md"
kind = "file"
overwrite = true

# The four architecture boundaries `skills/agent-startup/SKILL.md` sends a reader
# to before touching the planner, the tiers, the executor, or intake. That skill
# travels whole and `CLAUDE.md` names it as the thing to read first, so until
# 2026-08-17 the public snapshot shipped the instruction with four dead links
# under it - found by `tests/test_traveling_document_links.py` on the day it was
# written, not by a reader, which is the only reason this is a manifest entry
# rather than an apology.
#
# They travel because a public reader wants them: they are what the startup
# ritual is for, and an agent told to read them cannot. De-linking was the other
# option and it is worse, because the skill would then name four documents that
# exist nowhere the reader can reach.
#
# Scanned against docs/public_release_checklist.md's denylist on 2026-08-17:
# clean on both patterns, and the only path hits are `~/.local-agent/...`, which
# is this tool's own directory and carries no username. None of the four has a
# relative link of its own, so publishing them drags nothing further behind.
[[allow]]
path = "docs/decomposition_dispatch.md"
kind = "file"
overwrite = true

