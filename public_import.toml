# README.md, CLAUDE.md, and AGENTS.md are deliberately absent from this list.
# The private copies are written for an operator who has the handoff log, the
# design docs, and the private target-project registry in front of them, and
# they link to all three. This repository owns its own README instead, and the
# importer never touches a destination file it was not asked to write, so the
# public README survives every import.

# The documentation tree does not travel. The private repository's docs/ is a
# working engineering log - dated handoffs, session postmortems, design
# arguments, client-project milestones - and publishing it publishes a
# narrative, not a system. Exactly two paths under docs/ are here, and both are
# here because code fails without them rather than because a reader wants them:
#
# docs/configuration.md is generated from the Settings model, not written.
# `scripts/dump_config_reference.py --check` reads a missing file as an empty
# one, so its absence is a mismatch, and `make config-docs-check` and
# `tests/test_openapi_contract.py` both fail on it.
#
# docs/examples/ holds the two design documents the test suite compiles. Both
# are loaded by path: `tests/work_unit_support.py` reads the acceptance doc and
# `tests/test_work_unit_golden_path.py` reads the golden-path doc.
[[allow]]
path = "docs/configuration.md"
kind = "file"
overwrite = true

[[allow]]
path = "docs/examples"
kind = "directory"
overwrite = true

